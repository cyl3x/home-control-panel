[package]
name = "home-control-panel"
description = "A dashboard for my home"
license = "GPL-3.0"
readme = "README.md"
keywords = ["dashboard", "iced", "gstreamer", "icalendar"]
categories = ["desktop-application"]
repository = "https://github.com/cyl3x/home-control-panel"
authors = ["cyl3x <cyl3x@posteo.de>"]
version = "0.1.0"
edition = "2024"

[[bin]]
name = "home-control-panel"
path = "src/main.rs"

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
strip = "debuginfo"

[dependencies]
async-channel = "2.5.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["unstable-locales", "serde"] }
chrono-tz = "0.10.4"
clapper = { package = "clapper-player", version = "0.10.1" }
clapper-gtk = { package = "clapper-player-gtk", version = "0.10.1", features = ["gtk_v4_18"] }
env_logger = "0.11.11"
glib-unix = "0.22.8"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_18"] }
icalendar = "0.17.15"
log = { version = "0.4.34", features = ["kv", "kv_std"]}
palette = "0.7.7"
ring = "0.17.14"
rrule = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
toml = "1.1.8"
ureq = { version = "3.4.2", features = ["cookies", "json"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v5", "serde"] }
webkit6 = { version = "0.6.1", features = ["v2_50", "gtk_v4_18"] }
xmltree = "0.12.0"
